name: digest

on:
  schedule:
    - cron: "53 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: refresh
        run: |
          set -eu
          sleep $(( RANDOM % 900 ))
          f="README.md"
          [ -f "$f" ] || exit 0
          stamp="<!-- checked: $(date -u +%Y-%m-%d) -->"
          if grep -q "^<!-- checked: " "$f"; then
            sed -i "s|^<!-- checked: .*|$stamp|" "$f"
          else
            printf '\n%s\n' "$stamp" >> "$f"
          fi

      - name: commit
        run: |
          set -eu
          git config user.name "andrey-ivanov-eng1998x8"
          git config user.email "279199432+andrey-ivanov-eng1998x8@users.noreply.github.com"
          set -- "docs: refresh timestamp" "chore: refresh metadata" "chore: scheduled refresh" "chore: periodic update" "docs: keep current"
          n=$(( ${GITHUB_RUN_NUMBER:-0} % $# + 1 ))
          eval msg=\${$n}
          git add -- "README.md"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "$msg"
          git push
